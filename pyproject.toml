[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-mcp-improved"
version = "1.0.6"
description = "MCP Server for Odoo Integration"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
]
keywords = ["odoo", "mcp", "server", "ai"]
authors = [
    {name = "Yhasmani Valdes", email = "yhasmanivm@gmail.com"}
]
dependencies = [
    "mcp>=1.6.0,<2.0",
    "fastmcp>=2.0,<3",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/hachecito/odoo-mcp-improved"
Issues = "https://github.com/hachecito/odoo-mcp-improved/issues"

[project.optional-dependencies]
dev = [
    "black",
    "isort",
    "mypy",
    "ruff",
    "build",
    "twine",
]

[project.scripts]
odoo-mcp-improved = "odoo_mcp.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["odoo_mcp"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
